name: verify-feeds

# 批量探测 RSS/Atom 源是否可用。
# 用法：Actions → verify-feeds → Run workflow → batch（1-20）+ chunk（默认 500，上限 800）。
# 每次只跑 candidates/candidates.csv 的一批切片，结果写入 results/batch_<batch>.csv 并提交回仓库。
# 详见仓库根目录 VERIFY.md。

on:
  workflow_dispatch:
    inputs:
      batch:
        description: '批次号（1-20，第 N 批从第 (N-1)*chunk+1 行开始）'
        required: true
        type: number
        default: 1
      chunk:
        description: '每批条数（默认 500，单批上限 800）'
        required: false
        type: number
        default: 500

run-name: verify-feeds batch ${{ inputs.batch }} chunk ${{ inputs.chunk }}

permissions:
  contents: write

# 同一批次串行，不同批次可并行，避免并发 push 互踩。
concurrency:
  group: verify-feeds-batch-${{ inputs.batch }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet requests feedparser

      - name: Verify batch ${{ inputs.batch }}
        run: |
          python .github/scripts/verify_feeds.py \
            --batch "${{ inputs.batch }}" \
            --chunk "${{ inputs.chunk }}"

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-batch-${{ inputs.batch }}
          path: results/batch_${{ inputs.batch }}.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Commit results
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "结果无变化，跳过提交"
            exit 0
          fi
          git commit -m "verify: batch ${{ inputs.batch }} (chunk=${{ inputs.chunk }}) $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            if git push; then
              echo "pushed"
              exit 0
            fi
            echo "push 失败，rebase 后重试（第 $i 次）"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep 5
          done
          echo "三次 push 均失败"
          exit 1
