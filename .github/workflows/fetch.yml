name: fetch-originals

# 用法：Actions → fetch-originals → Run workflow → urls 每行一个网址
# 直连失败时自动改用 r.jina.ai 阅读代理重试（可绕过 Akamai/Cloudflare 的 403）

on:
  workflow_dispatch:
    inputs:
      urls:
        description: '要下载的网址，每行一个'
        required: true
        default: |
          https://www.mofa.go.jp/mofaj/toko/kaigai/index.html

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir -p files
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          i=0
          echo "$URLS" | while read -r u; do
            [ -z "$u" ] && continue
            i=$((i+1))
            host=$(echo "$u" | sed -E 's#https?://([^/]+)/?.*#\1#')
            base="files/${host}_${i}"
            # 1) 直连
            code=$(curl -sSL --max-time 60 -A "$UA" -H 'Accept: text/html,application/xhtml+xml,application/pdf,*/*' \
                   -H 'Accept-Language: en-US,en;q=0.9,zh-CN;q=0.8' -o "${base}.bin" -w '%{http_code}' "$u" || echo 000)
            size=$(stat -c%s "${base}.bin" 2>/dev/null || echo 0)
            # 2) 直连失败 → r.jina.ai 代理
            if [ "$code" != "200" ] || [ "$size" -lt 3000 ]; then
              echo "direct $code/$size, retry via r.jina.ai"
              code2=$(curl -sSL --max-time 90 -H 'Accept: text/plain' -o "${base}.bin" -w '%{http_code}' "https://r.jina.ai/$u" || echo 000)
              size2=$(stat -c%s "${base}.bin" 2>/dev/null || echo 0)
              if [ "$code2" = "200" ] && [ "$size2" -gt 500 ]; then code=$code2; size=$size2; fi
            fi
            ext="html"
            head -c 4 "${base}.bin" 2>/dev/null | grep -q '%PDF' && ext="pdf"
            if [ "$size" -gt 2000 ]; then
              mv "${base}.bin" "${base}.${ext}"
              echo "OK   $code $size $u -> ${base}.${ext}"
            else
              rm -f "${base}.bin"; echo "FAIL $code $size $u"
            fi
          done
          ls -lh files || true

      - name: Commit
        run: |
          git config user.name "fetch-bot"
          git config user.email "fetch-bot@users.noreply.github.com"
          git add -A files
          if git diff --cached --quiet; then echo "no new files"; else
            git commit -m "fetch: $(date -u +%Y-%m-%dT%H:%MZ)"; git push; fi
